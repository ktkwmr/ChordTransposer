name: Build generated pages

# Regenerates public/chordtransposer/ja/index.html from
# public/chordtransposer/index.html, and the guide pages and sitemap.xml from
# scripts/pages/ (including the top page public/index.html and public/ja/index.html), then commits the changes.
on:
  push:
    branches: [main]
    paths:
      - "public/chordtransposer/index.html"
      - "public/chordtransposer/ja/index.html"
      - "scripts/build-ja.mjs"
      - "scripts/build-pages.mjs"
      - "scripts/pages/**"
      - "public/sitemap.xml"
      - "public/chordtransposer/sitemap.xml"
      - "public/index.html"
      - "public/ja/index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ja
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate ja/index.html
        run: node scripts/build-ja.mjs

      - name: Generate guide pages and sitemap.xml
        run: node scripts/build-pages.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/chordtransposer public/sitemap.xml public/index.html public/ja
          git commit -m "生成ページ（ja/index.html・トップページ・ガイドページ・sitemap.xml）を再生成"
          git push
